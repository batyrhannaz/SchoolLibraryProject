{% extends "base.html" %}
{% block title %}Вход — Школьная библиотека{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="tabs">
    <button class="tab-btn active" data-tab="login-form">Вход</button>
    <button class="tab-btn" data-tab="register-form">Регистрация</button>
  </div>

  <form id="login-form" class="auth-form">
    <h2>Вход</h2>
    <label>
      Логин
      <input type="text" name="username" required>
    </label>
    <label>
      Пароль
      <input type="password" name="password" required>
    </label>
    <p class="form-error" id="login-error"></p>
    <button type="submit" class="btn btn-primary">Войти</button>
  </form>

  <form id="register-form" class="auth-form" style="display:none;">
    <h2>Регистрация</h2>
    <label>
      Логин
      <input type="text" name="username" required>
    </label>
    <label>
      Имя
      <input type="text" name="first_name">
    </label>
    <label>
      Фамилия
      <input type="text" name="last_name">
    </label>
    <label>
      Email
      <input type="email" name="email">
    </label>
    <label>
      Телефон
      <input type="text" name="phone">
    </label>
    <label>
      Пароль
      <input type="password" name="password" required>
    </label>
    <p class="form-error" id="register-error"></p>
    <p class="form-success" id="register-success"></p>
    <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
  </form>
</section>
{% endblock %}

{% block scripts %}
{% load static %}
<script src="{% static 'js/auth.js' %}"></script>
{% endblock %}
