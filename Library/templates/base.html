{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Школьная библиотека{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <header class="navbar">
    <a href="/" class="logo">📚 Школьная библиотека</a>
    <nav>
      <a href="/catalog/">Каталог</a>
      <a href="/loans/" id="nav-loans">Мои выдачи</a>
      <a href="/profile/" id="nav-profile" style="display:none;">Профиль</a>
      <a href="/admin-panel/" id="nav-admin" style="display:none;">Админка</a>
      <a href="/login/" id="nav-login">Войти</a>
      <a href="#" id="nav-logout" style="display:none;">Выйти</a>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script src="{% static 'js/api.js' %}"></script>
  <script src="{% static 'js/nav.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
